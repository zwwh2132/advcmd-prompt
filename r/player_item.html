<h1>配方 · 取玩家手上 / 背包的物品</h1><p class="hint">关键词：物品、手持、背包、itemDict、给物品 · 命中就按这里写</p>
<button id="cp" type="button">复制全文</button>
<pre id="spec">// 主手：var it = call(comp(pid, "item"), "GetPlayerItem", [2, 0]);
// 物品 id = it["itemName"]，数量 = it["count"]；没有物品时返回 null，先判空。
// 背包：GetPlayerAllItems(0) 返回列表；give(pid, "minecraft:diamond", 1) 是发物品。</pre>
<p class="foot">内容指纹 b57e7610 · 本页无任何外部请求</p>
<script>document.getElementById('cp').onclick=function(){var t=document.getElementById('spec').textContent,b=this;
function ok(){b.textContent='已复制';setTimeout(function(){b.textContent='复制全文';},1500);}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){sel();});}else{sel();}
function sel(){var r=document.createRange();r.selectNodeContents(document.getElementById('spec'));
var s=window.getSelection();s.removeAllRanges();s.addRange(r);b.textContent='已选中，长按复制';}};</script>
